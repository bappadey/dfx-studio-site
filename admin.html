<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFX | Admin Backend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #050505; color: white; font-family: sans-serif; }
        .dfx-card { background: #111; border: 1px solid #222; padding: 25px; border-radius: 20px; margin-bottom: 25px; }
        input { background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white; width: 100%; margin-bottom: 10px; outline: none; }
        .btn-magenta { background: #CD1F85; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-magenta:hover { opacity: 0.8; }
        .delete-btn { color: #ff4444; cursor: pointer; padding: 10px; }
    </style>
</head>
<body class="p-6 md:p-20">

    <div id="login-screen" class="text-center py-32">
        <h1 class="text-5xl font-bold mb-10 text-[rgb(205,31,133)] uppercase">DFX Admin</h1>
        <button id="login-btn" class="btn-magenta px-12">LOGIN WITH GOOGLE</button>
    </div>

    <div id="admin-content" class="hidden max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 border-b border-zinc-800 pb-6">
            <h1 class="text-3xl font-bold">DFX CMS Control</h1>
            <button onclick="auth.signOut()" class="text-zinc-500 hover:text-white">Logout</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <div class="dfx-card">
                <h2 class="text-2xl font-bold mb-6 text-[rgb(205,31,133)]">ADD PORTFOLIO VIDEO</h2>
                <input type="text" id="v-url" placeholder="Paste full YouTube Link">
                <input type="text" id="v-title" placeholder="Project Title">
                <button id="add-v" class="btn-magenta w-full">ADD TO SITE</button>
                <div id="v-list" class="mt-8 space-y-3 max-h-96 overflow-y-auto"></div>
            </div>

            <div class="dfx-card">
                <h2 class="text-2xl font-bold mb-6 text-blue-500">MANAGE CLIENT LOGOS</h2>
                <input type="text" id="c-name" placeholder="Filename (e.g. Walton.png)">
                <button id="add-c" class="btn-magenta w-full" style="background: #3b82f6;">ADD LOGO</button>
                <div id="c-list" class="mt-8 grid grid-cols-2 gap-3 max-h-96 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIX4Al2mFvSeDCgE01FWGXRuuowJwpjXg",
            authDomain: "dfx-reviews.firebaseapp.com",
            projectId: "dfx-reviews",
            storageBucket: "dfx-reviews.firebasestorage.app",
            messagingSenderId: "71883383009",
            appId: "1:71883383009:web:7fc96391ad98f5cff357a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const adminEmail = "bappadey61@gmail.com"; // <--- আপনার ইমেইল দিন

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === adminEmail) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadAdminData();
            } else if (user) {
                alert("Unauthorized!");
                auth.signOut();
            }
        });

        function extractID(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.match(regex);
            return (match && match[1]) ? match[1] : url;
        }

        function loadAdminData() {
            onSnapshot(query(collection(db, "portfolio"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('v-list'); list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `<div class="p-3 bg-zinc-900 rounded-lg flex justify-between border border-zinc-800">
                        <div><p class="font-bold text-xs">${d.data().title}</p></div>
                        <i class="fas fa-trash delete-btn" onclick="deleteItem('portfolio','${d.id}')"></i>
                    </div>`;
                });
            });
            onSnapshot(collection(db, "clients_list"), (snap) => {
                const list = document.getElementById('c-list'); list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `<div class="p-2 bg-zinc-800 rounded flex justify-between">
                        <span class="text-xs truncate">${d.data().filename}</span>
                        <i class="fas fa-times delete-btn" onclick="deleteItem('clients_list','${d.id}')"></i>
                    </div>`;
                });
            });
        }

        document.getElementById('add-v').onclick = async () => {
            const vid = extractID(document.getElementById('v-url').value);
            const title = document.getElementById('v-title').value;
            if(vid && title) {
                await addDoc(collection(db, "portfolio"), { id: vid, title: title, createdAt: serverTimestamp() });
                document.getElementById('v-url').value = ""; document.getElementById('v-title').value = "";
            }
        };

        document.getElementById('add-c').onclick = async () => {
            const name = document.getElementById('c-name').value;
            if(name) { await addDoc(collection(db, "clients_list"), { filename: name }); document.getElementById('c-name').value = ""; }
        };

        window.deleteItem = async (col, id) => { if(confirm("Delete?")) await deleteDoc(doc(db, col, id)); };
    </script>
</body>
</html>
