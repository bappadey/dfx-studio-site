<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFX | Admin Panel (Batch Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dfx-magenta: #CD1F85; --dfx-purple: #2F1C52; }
        body { background: #050505; color: white; font-family: sans-serif; }
        .dfx-card { background: #111; border: 1px solid #222; padding: 25px; border-radius: 20px; margin-bottom: 25px; }
        input, textarea, .file-input { background: #1a1a1a; border: 1px solid #333; padding: 12px; border-radius: 8px; color: white; width: 100%; margin-bottom: 10px; outline: none; }
        input:focus, textarea:focus { border-color: var(--dfx-magenta); }
        .btn-magenta { background: var(--dfx-magenta); color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; transition: 0.3s; width: 100%; }
        .btn-magenta:hover { opacity: 0.8; transform: translateY(-2px); }
        .delete-btn { color: #ff4444; cursor: pointer; transition: 0.3s; padding: 10px; }
        .toggle-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: #aaa; margin-bottom: 15px; }
        #status-box { font-size: 13px; color: var(--dfx-magenta); margin-bottom: 10px; display: none; background: rgba(205,31,133,0.1); padding: 10px; border-radius: 8px; border: 1px solid var(--dfx-magenta); }
    </style>
</head>
<body class="p-6 md:p-20">

    <div id="login-screen" class="text-center py-32">
        <h1 class="text-5xl font-bold mb-10 text-[rgb(205,31,133)] uppercase tracking-tighter">DFX BACKEND</h1>
        <button id="login-btn" class="btn-magenta max-w-xs">LOGIN WITH GOOGLE</button>
    </div>

    <div id="admin-content" class="hidden max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-10 border-b border-zinc-800 pb-6">
            <h1 class="text-3xl font-bold italic uppercase">Batch Control Center</h1>
            <button onclick="auth.signOut()" class="text-zinc-500 hover:text-white">Logout</button>
        </div>

        <div id="status-box"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- MULTI PORTFOLIO MANAGER -->
            <div class="dfx-card">
                <h2 class="text-2xl font-bold mb-4 text-[rgb(205,31,133)] uppercase">Add Portfolio Videos</h2>
                <p class="text-xs text-zinc-500 mb-4 italic">Paste YouTube links below (one per line)</p>
                <textarea id="v-urls" rows="6" placeholder="https://youtube.com/watch?v=...&#10;https://youtu.be/..."></textarea>
                <input type="text" id="v-title-common" placeholder="Common Title (optional)">
                
                <label class="toggle-label"><input type="checkbox" id="v-show-title" checked class="w-5 h-5 accent-[rgb(205,31,133)]"> Show Titles on Website?</label>

                <button id="add-v-batch" class="btn-magenta">BATCH ADD VIDEOS</button>
                
                <div id="v-list" class="mt-8 space-y-2 max-h-80 overflow-y-auto pr-2"></div>
            </div>

            <!-- MULTI LOGO MANAGER -->
            <div class="dfx-card">
                <h2 class="text-2xl font-bold mb-4 text-blue-500 uppercase">Upload Client Logos</h2>
                <p class="text-xs text-zinc-500 mb-4 italic">You can select multiple files at once</p>
                <input type="file" id="c-files" class="file-input" accept="image/*" multiple>
                <button id="add-c-batch" class="btn-magenta" style="background: #3b82f6;">BATCH UPLOAD & SAVE</button>
                
                <div id="c-list" class="mt-8 grid grid-cols-4 gap-3 max-h-80 overflow-y-auto pr-2"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIX4Al2mFvSeDCgE01FWGXRuuowJwpjXg",
            authDomain: "dfx-reviews.firebaseapp.com",
            projectId: "dfx-reviews",
            storageBucket: "dfx-reviews.firebasestorage.app",
            messagingSenderId: "71883383009",
            appId: "1:71883383009:web:7fc96391ad98f5cff357a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const adminEmail = "your-email@gmail.com"; // <--- CHANGE TO YOUR GMAIL
        const IMGBB_KEY = "6c180ea35e97176e79cde2c007894032";

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === adminEmail) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadData();
            } else if (user) { alert("Access Denied!"); auth.signOut(); }
        });

        function extractID(url) {
            const reg = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = url.trim().match(reg);
            return (match && match[1]) ? match[1] : (url.length === 11 ? url : null);
        }

        function showStatus(msg) {
            const box = document.getElementById('status-box');
            box.style.display = "block";
            box.innerHTML = msg;
        }

        function loadData() {
            onSnapshot(query(collection(db, "portfolio"), orderBy("createdAt", "desc")), (snap) => {
                const list = document.getElementById('v-list'); list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `<div class="p-2 bg-zinc-900 rounded flex justify-between border border-zinc-800 text-[10px]">
                        <span class="truncate">${d.data().title || 'No Title'}</span>
                        <i class="fas fa-trash delete-btn" onclick="deleteItem('portfolio','${d.id}')"></i>
                    </div>`;
                });
            });
            onSnapshot(collection(db, "clients_list"), (snap) => {
                const list = document.getElementById('c-list'); list.innerHTML = "";
                snap.forEach(d => {
                    list.innerHTML += `<div class="relative"><img src="${d.data().url}" class="h-12 w-full object-contain bg-white rounded p-1">
                    <i class="fas fa-times-circle absolute -top-1 -right-1 text-red-500 cursor-pointer text-xs" onclick="deleteItem('clients_list','${d.id}')"></i></div>`;
                });
            });
        }

        // --- BATCH ADD VIDEOS ---
        document.getElementById('add-v-batch').onclick = async () => {
            const urls = document.getElementById('v-urls').value.split('\n');
            const commonTitle = document.getElementById('v-title-common').value;
            const showTitle = document.getElementById('v-show-title').checked;
            let count = 0;

            for(let url of urls) {
                const vid = extractID(url);
                if(vid) {
                    const q = query(collection(db, "portfolio"), where("id", "==", vid));
                    const check = await getDocs(q);
                    if (check.empty) {
                        await addDoc(collection(db, "portfolio"), { id: vid, title: commonTitle || "DFX Work", showTitle, createdAt: serverTimestamp() });
                        count++;
                    }
                }
            }
            alert(`Batch Complete: Added ${count} new videos.`);
            document.getElementById('v-urls').value = "";
        };

        // --- BATCH UPLOAD LOGOS ---
        document.getElementById('add-c-batch').onclick = async () => {
            const files = document.getElementById('c-files').files;
            if(files.length === 0) return alert("Select files first!");

            for(let i = 0; i < files.length; i++) {
                showStatus(`Uploading Logo ${i+1} of ${files.length}...`);
                const formData = new FormData();
                formData.append("image", files[i]);

                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: formData });
                    const json = await res.json();
                    if(json.success) {
                        const newUrl = json.data.url;
                        const q = query(collection(db, "clients_list"), where("url", "==", newUrl));
                        const check = await getDocs(q);
                        if (check.empty) {
                            await addDoc(collection(db, "clients_list"), { url: newUrl });
                        }
                    }
                } catch (e) { console.error("Upload failed for file " + i); }
            }
            showStatus("All uploads complete!");
            document.getElementById('c-files').value = "";
            setTimeout(() => document.getElementById('status-box').style.display = "none", 3000);
        };

        window.deleteItem = async (col, id) => { if(confirm("Confirm Delete?")) await deleteDoc(doc(db, col, id)); };
    </script>
</body>
</html>
