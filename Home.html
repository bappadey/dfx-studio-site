<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFX | Animation & VFX Studio</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="Asset/dfx.ico">

    <!-- Fonts & Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Brand Colors */
        :root {
            --dfx-purple: rgb(47, 28, 82);   /* #2F1C52 */
            --dfx-magenta: rgb(205, 31, 133); /* #CD1F85 */
        }

        /* Custom Fonts */
        h1, h2, h3, .font-bebas { font-family: 'Bebas Neue', cursive; letter-spacing: 2px; }
        .font-rai { font-family: 'RaiLowercase', 'Inter', sans-serif; }

        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth; 
            overflow-x: hidden; 
        }

        /* 1. Intro Animation */
        #intro {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        /* 2. Hero Video */
        .hero-video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
            overflow: hidden; z-index: -1;
        }
        .hero-video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }

        /* 3. Header Blur for Readability - FIXED */
        header {
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* 4. Section Buttons - FIXED READABILITY */
        .nav-btn {
            color: #ffffff !important;
            font-family: 'Bebas Neue';
            font-size: 1.4rem;
            transition: all 0.3s ease;
            padding: 5px 15px;
        }
        .nav-btn:hover {
            color: var(--dfx-magenta) !important;
        }
        .contact-pill {
            background-color: var(--dfx-magenta);
            border-radius: 50px;
        }
        .contact-pill:hover {
            background-color: white;
            color: var(--dfx-magenta) !important;
        }

        /* 5. Swiper Slider */
        .swiper { width: 100%; height: 480px; border-radius: 12px; border: 1px solid var(--dfx-purple); }
        .swiper-slide img, .swiper-slide video { width: 100%; height: 100%; object-fit: cover; }

        /* Typewriter Effect Styling */
        #typewriter-box {
            min-height: 80px;
            font-family: 'Bebas Neue';
            color: var(--dfx-magenta);
            font-size: 3.8rem;
            line-height: 1.1;
            text-transform: uppercase;
        }

        /* 6. Video Modal */
        #videoModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 10000; justify-content: center; align-items: center;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--dfx-magenta); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 1. Intro Section -->
    <div id="intro">
        <img src="Asset/DFX LOGO Intro.gif" alt="DFX Intro" class="w-80 h-auto">
    </div>

    <!-- 2. Header Navigation -->
    <header class="fixed top-0 w-full p-4 flex justify-between items-center z-50 px-8 md:px-20">
        <div class="flex items-center">
            <img src="Asset/LOGO.png" alt="DFX" class="w-12 h-12 mr-3">
            <span class="text-4xl font-bebas font-bold text-white tracking-tighter">DFX</span>
        </div>
        <nav class="hidden md:flex items-center space-x-8">
            <a href="#work" class="nav-btn">PROJECTS</a>
            <a href="#services" class="nav-btn">SERVICES</a>
            <a href="#clients" class="nav-btn">CLIENTS</a>
            <a href="#contact" class="nav-btn contact-pill">CONTACT</a>
        </nav>
    </header>

    <!-- 3. Hero Section -->
    <section class="relative h-screen flex flex-col items-center justify-center text-center px-4">
        <div class="hero-video-container">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="Asset/DFX Showreel.mp4" type="video/mp4">
            </video>
        </div>
        <div class="z-10">
            <h1 class="text-7xl md:text-9xl font-bebas font-black mb-4 text-white drop-shadow-2xl">DFX</h1>
            <p class="text-lg md:text-2xl font-rai font-bold uppercase tracking-[8px] text-[rgb(205,31,133)] bg-black/30 px-6 py-2 rounded-full">
                Dynamic • Determined • Delightful • Dedicated
            </p>
        </div>
    </section>

    <!-- 4. Projects Section (YouTube) -->
    <section id="work" class="py-24 px-6 md:px-20 bg-black">
        <h2 class="text-5xl font-bebas mb-16 text-center italic border-b-2 border-[rgb(47,28,82)] inline-block w-full uppercase">Our Portfolio</h2>
        <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            <!-- Loaded via JavaScript -->
        </div>
    </section>

    <!-- 5. Service Section (Synced Slider & Typewriter) -->
    <section id="services" class="py-24 bg-[rgb(5,5,5)] px-6 md:px-20">
        <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-16 items-center">
            <div>
                <h2 class="text-xl text-white opacity-40 uppercase tracking-[5px] mb-4">Our Expertise</h2>
                <div id="typewriter-box"></div>
                <p id="service-desc" class="text-gray-400 mt-6 text-xl font-rai leading-relaxed border-l-2 border-[rgb(205,31,133)] pl-6"></p>
            </div>

            <div class="shadow-2xl shadow-[rgb(47,28,82)]/40">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper" id="service-slides">
                        <!-- Loaded via JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 6. Clients Section -->
    <section id="clients" class="py-24 px-6 text-center bg-black">
        <h2 class="text-4xl font-bebas mb-16 opacity-30 uppercase italic tracking-widest">Global Partners</h2>
        <div id="clients-container" class="flex flex-wrap justify-center items-center gap-12 md:gap-20">
            <!-- Client images loaded via JS -->
        </div>
    </section>

    <!-- 7. Contact Section - FIXED GMAIL LINK -->
    <footer id="contact" class="py-24 bg-[rgb(47,28,82)] px-6 text-center">
        <h2 class="text-6xl font-bebas mb-16 italic text-white">Let's Create Together</h2>
        <div class="flex justify-center flex-wrap gap-12 text-5xl mb-16">
            <a href="https://facebook.com/DFX.anime" target="_blank" class="hover:text-[rgb(24,119,242)] transition transform hover:scale-110" title="Follow us"><i class="fab fa-facebook"></i></a>
            <a href="https://youtube.com/@DFX-studio" target="_blank" class="hover:text-red-500 transition transform hover:scale-110" title="Subscrib us"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/dfxanime/" target="_blank" class="hover:text-[rgb(205,31,133)] transition transform hover:scale-110" title="Follow us"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/+8801738194746" target="_blank" class="hover:text-green-400 transition transform hover:scale-110" title="Connect with Whatsapp"><i class="fab fa-whatsapp"></i></a>
            <a href="tel:+8809639194746" class="hover:text-[rgb(205,31,133)] transition transform hover:scale-110" title="Call us"><i class="fas fa-phone-alt"></i></a>
            
            <!-- GMAIL DIRECT POPUP -->
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=info@dfxbd.com&su=Project Inquiry" target="_blank" class="hover:text-[rgb(251,188,4)] transition transform hover:scale-110" title="Email us via Gmail">
                <i class="fas fa-envelope"></i>
            </a>

            <a href="https://maps.app.goo.gl/PvRqmnj43F1qQuBe6" target="_blank" class="hover:text-blue-300 transition transform hover:scale-110" title="Locate us"><i class="fas fa-map-marker-alt"></i></a>
        </div>
        <p class="text-white opacity-40 font-rai tracking-[5px] text-xs uppercase">© 2026 DFX Studio | Visualizing Imagination</p>
    </footer>

    <!-- Video Modal Player -->
    <div id="videoModal" onclick="closeVideo()">
        <span class="absolute top-8 right-8 text-6xl cursor-pointer text-white opacity-20 hover:opacity-100">&times;</span>
        <div class="w-11/12 md:w-4/5 aspect-video" onclick="event.stopPropagation()">
            <iframe id="videoPlayer" class="w-full h-full rounded-lg shadow-2xl" 
                src="" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // 1. YouTube Data - FIXED IMAGE SOURCE
        const projects = [
            { id: 'FVNMLvH35Ys', title: 'Action Reel' }, { id: 'xFwnun3zMH4', title: 'VFX Scene' },
            { id: 'XXunnh1Bokk', title: 'Cinema' }, { id: 'wREenI4RRgc', title: 'TVC' },
            { id: 'QlsWKDEJWtk', title: 'Motion' }, { id: 'Gh-8nJfbSVs', title: 'Animation' },
            { id: 'vuNy4gvvoZc', title: 'VFX' }, { id: '_WI1QZTFXX4', title: 'Visuals' },
            { id: '2r1lr7dLano', title: '3D VFX' }, { id: '9ktiKThBwZA', title: 'CGI' },
            { id: 'N5D2_bK5RNM', title: 'Ads' }, { id: 'nO72m__mcew', title: 'Reel' },
            { id: 'OvFSsmLqyCc', title: 'VFX' }, { id: 'bL5uI2NAKDM', title: 'Cinema' },
            { id: 'kAshuCi6UJw', title: 'Action' }, { id: '5gf0Icoizs8', title: 'Commercial' },
            { id: 'S-bsAyqS4KY', title: 'Effect' }, { id: '1Cdo8-VwHpY', title: 'CGI' },
            { id: 'dxb-3G4qYyo', title: 'Visual' }, { id: 'STtoeP24j4g', title: 'Motion' },
            { id: 'Ehn5iVm0Ox0', title: 'Ads' }, { id: 'd-gbIabi8ok', title: 'Scene' },
            { id: 'ziI3mLHN3YA', title: 'Reel' }, { id: 'YzyzPK16Slc', title: 'Motion' },
            { id: 'JdCC1Xld15Q', title: 'Action' }, { id: 'L2_iRJjAJZ0', title: 'Visual' },
            { id: '3brG7XOeVog', title: 'Cinema' }, { id: 'WxYedjhxj1A', title: 'VFX' },
            { id: 'fA6Jvc7mxxY', title: 'Ads' }, { id: 'Jxiy-f9NkJo', title: 'Scene' },
            { id: 'ekxCVhuoOOw', title: 'Commercial' }, { id: 'SOeBXI2d26I', title: 'Animation' },
            { id: 'CZ4GzZjTPj4', title: '3D VFX' }
        ];

        // 2. Service Slider Data
        const services = [
            { type: 'video', file: 'vfx.mp4', title: 'VFX & CGI', desc: 'Crafting cinematic visual effects for movies and high-end series.' },
            { type: 'image', file: 'motion.jpg', title: 'MOTION GRAPHICS', desc: 'Bringing designs to life with dynamic motion and brand energy.' },
            { type: 'image', file: '3danim.gif', title: '3D ANIMATION', desc: 'High-quality 3D character assets and stylized animations.' }
        ];

        // 3. Client Logos
        const clientLogos = [
            'LUX_(soap)_logo.png', 'NESTLElogo.png', 'Vim.png', 'drug.png', 'Aarong Dairy.jpg', 'Ama.png', 'Asian Paints.png', 'bKash.png', 'Brac.png', 'BritishCouncil.png', 'CartUP.png', 'CEAT.png', 'Chaka.jpg', 'Chefchoice.png', 'Clear Men.jpeg', 'Clemon.jpeg', 'closeup.png', 'Daraz.png', 'Electromart.png', 'Farmfresh.jpeg', 'Finlay.webp', 'Foodi.png', 'foton.png', 'Freedom.png', 'Fresh anonna.jpeg', 'fresh_lp_gas.png', 'Frutika.jpeg', 'Goldmark.jpeg', 'goodknight.png', 'Gozayaan.jpg', 'GP.png', 'GPH.jpg', 'Harpic.png', 'Honor.png', 'IDLC.png', 'IPDC.png', 'KSRM.png', 'lee cooper.png', 'Link3.png', 'Lotto.png', 'Parachute Skinpure.jpg', 'Pathao.png', 'Power.jpeg', 'SSL.png', 'Starline.jpeg', 'Sunquick.png', 'Sylon tea.jpeg', 'TikTok.png', 'TSports.png', 'Veet.png', 'Walton.png', 'Yamaha.png'
        ];

        // Initializer
        function initSite() {
            // Portfolio
            const pGrid = document.getElementById('portfolio-grid');
            projects.forEach(p => {
                pGrid.innerHTML += `
                    <div class="cursor-pointer group relative overflow-hidden rounded-xl bg-zinc-900 shadow-lg" onclick="openVideo('${p.id}')">
                        <img src="https://img.youtube.com/vi/${p.id}/hqdefault.jpg" class="w-full transition duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-500">
                            <i class="fas fa-play-circle text-7xl text-[rgb(205,31,133)]"></i>
                            <h3 class="mt-4 text-2xl font-bebas text-white">${p.title}</h3>
                        </div>
                    </div>`;
            });

            // Clients
            const cContainer = document.getElementById('clients-container');
            clientLogos.forEach(logo => {
                cContainer.innerHTML += `<img src="Asset/clients/${logo}" class="h-16 md:h-24 w-auto object-contain transition duration-500 hover:scale-110">`;
            });

            // Service Slider
            const sWrapper = document.getElementById('service-slides');
            services.forEach(s => {
                let media = s.type === 'video' 
                    ? `<video autoplay muted loop playsinline><source src="Asset/service/${s.file}" type="video/mp4"></video>` 
                    : `<img src="Asset/service/${s.file}">`;
                sWrapper.innerHTML += `<div class="swiper-slide">${media}</div>`;
            });

            // Swiper Init
            const swiper = new Swiper(".mySwiper", {
                loop: true,
                autoplay: { delay: 3000, disableOnInteraction: false },
                on: { slideChange: function() { startTypewriter(this.realIndex); } }
            });
        }

        // Typewriter Logic - FIXED SYNC
        let twInterval;
        function startTypewriter(index) {
            const box = document.getElementById('typewriter-box');
            const desc = document.getElementById('service-desc');
            const targetTitle = services[index].title;
            
            desc.innerText = services[index].desc;
            box.innerText = "";
            clearInterval(twInterval);
            
            let i = 0;
            twInterval = setInterval(() => {
                if (i < targetTitle.length) {
                    box.innerText += targetTitle.charAt(i);
                    i++;
                } else { clearInterval(twInterval); }
            }, 50);
        }

        // YouTube Modal Logic - FIXED Error 153
        function openVideo(id) {
            const player = document.getElementById('videoPlayer');
            player.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`;
            document.getElementById('videoModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeVideo() {
            document.getElementById('videoPlayer').src = "";
            document.getElementById('videoModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Page Load
        window.addEventListener('load', () => {
            initSite();
            setTimeout(() => {
                const intro = document.getElementById('intro');
                intro.style.transition = "opacity 1.5s ease";
                intro.style.opacity = "0";
                setTimeout(() => intro.style.display = "none", 1500);
            }, 5000);
        });
    </script>
</body>
</html>
